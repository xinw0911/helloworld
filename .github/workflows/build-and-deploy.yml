name: Build and Deploy Java Calculator

on:
  push:
    branches: [ test ]
  workflow_dispatch:

env:
  AWS_ACCOUNT_ID: "834197531540"
  AWS_REGION: us-west-2
  ECR_REGISTRY: 834197531540.dkr.ecr.us-west-2.amazonaws.com
  ECR_REPOSITORY: gh/repo
  CFN_STACK_NAME: enhanced-calculator-ecr-infrastructure
  ENVIRONMENT: production

permissions:
  id-token: write
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/testgithub
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Push Docker images to ECR
        run: |
          export ACCOUNT=$(aws sts get-caller-identity | jq .Account -r)
          export REGION=${{ env.AWS_REGION }}
          export COMMIT_SHA=${{ github.sha }}
          chmod +x ./push-ecr.sh
          ./push-ecr.sh

      - name: Verify deployment
        run: |
          export ACCOUNT=$(aws sts get-caller-identity | jq .Account -r)
          export REGION=${{ env.AWS_REGION }}
          export COMMIT_SHA=${{ github.sha }}
          export REPOSITORY_PREFIX=${ACCOUNT}.dkr.ecr.${REGION}.amazonaws.com
          export REPOSITORY_NAME=${{ env.ECR_REPOSITORY }}
          
          echo "Deployed to account: $ACCOUNT"
          echo "Image pushed to: ${REPOSITORY_PREFIX}/${REPOSITORY_NAME}:latest"
          echo "Image pushed to: ${REPOSITORY_PREFIX}/${REPOSITORY_NAME}:${COMMIT_SHA}"

#      - name: Check if CloudFormation stack exists
